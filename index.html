const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function open(pw,remember){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:250000,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  if(remember)try{localStorage.setItem("japon-pw",pw)}catch(e){}
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
}
